[/Script/GameplayTags.GameplayTagsList]
; Designer-extensible Sandwich Steam tags (registered by FSandwichSteamModule::RegisterTagIniSearchPath).
; Native tags (Steam.Feature.*, Steam.Error.*) are defined in C++ (Core/SteamGameplayTags.cpp) and must not be repeated here.
GameplayTagList=(Tag="Steam.Achievement",DevComment="Root for achievement tags. Add one child per achievement, for example Steam.Achievement.FirstWin.")
GameplayTagList=(Tag="Steam.Stat",DevComment="Root for stat tags. Add one child per stat, for example Steam.Stat.EnemiesDefeated.")
GameplayTagList=(Tag="Steam.Leaderboard",DevComment="Root for leaderboard tags. Add one child per leaderboard, for example Steam.Leaderboard.HighScore.")
GameplayTagList=(Tag="Steam.DLC",DevComment="Root for DLC tags. Add one child per DLC, for example Steam.DLC.SoundtrackPack.")
GameplayTagList=(Tag="Steam.Presence",DevComment="Root for rich presence tags. Add one child per status, for example Steam.Presence.InMatch.")
GameplayTagList=(Tag="Steam.Session",DevComment="Root for session profile tags. Add one child per kind of match, for example Steam.Session.Coop.")
GameplayTagList=(Tag="Steam.Input.ActionSet",DevComment="Root for Steam Input action set tags. Add one child per action set or layer, for example Steam.Input.ActionSet.Gameplay.")
