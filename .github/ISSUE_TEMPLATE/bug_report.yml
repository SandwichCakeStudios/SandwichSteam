name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: engine
    attributes:
      label: Unreal Engine version
      placeholder: "5.8.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where does it happen?
      options: [Standalone Game, Packaged build, Play In Editor, Editor tools (Dashboard / App Definition / Publish)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: dump
    attributes:
      label: Output of `Steam.Core.Dump` and relevant log lines (LogSandwichSteam)
      render: text
