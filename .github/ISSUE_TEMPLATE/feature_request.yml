name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe your goal, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea for how it could work
